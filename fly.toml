# fly.toml app configuration file generated for nullclow-aw on 2026-03-07
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "nullclow-aw"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  PYTHONUNBUFFERED = "1"
  
  # Required: Add your OpenRouter API key
  # OPENROUTER_API_KEY = "sk-or-v1-your-key-here"
  
  # Optional but recommended
  # SECRET_KEY = "your-secret-key-here"
  # ADMIN_EMAIL = "your-email@example.com"
  
  # Database (SQLite by default, no need to set)
  DATABASE_URL = "sqlite:///app/data/platform.db"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "nullclow_data"
  destination = "/app/data"
  initial_size = "1gb"

[checks]
  [checks.health]
    port = 5000
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
